spring.application.name=ms-propuestas

# Puerto configurable con la variable de entorno PROPUESTAS_PORT (por defecto 8082)
server.port=${PROPUESTAS_PORT:8082}

# Dirección de ms-usuarios y tiempo máximo de espera de cada llamada
usuarios.url=${USUARIOS_URL:http://localhost:8081}
usuarios.timeout-ms=${USUARIOS_TIMEOUT_MS:2000}

management.endpoints.web.exposure.include=health,info

# JSON con charset=UTF-8 en Content-Type, para que PowerShell 5.1 muestre bien las tildes
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force-response=true
