spring.application.name=ms-usuarios

# Puerto configurable con la variable de entorno USUARIOS_PORT (por defecto 8081)
server.port=${USUARIOS_PORT:8081}

# Solo se exponen health e info del actuator
management.endpoints.web.exposure.include=health,info

# JSON con charset=UTF-8 en Content-Type, para que PowerShell 5.1 muestre bien las tildes
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force-response=true
